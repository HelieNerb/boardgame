<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mayo Party — Debug</title>
  <link rel="stylesheet" href="../public/style.css">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <h1>Mayo Party 🌭 !</h1>
  <div id="menu">
    <a href="http://localhost:3000/host/"><button>Hôte</button></a><br>
    <a href="http://localhost:3000/play/"><button>Joueur</button></a><br>
    <p class="message">Debug — mini-jeux</p>
    <button data-game="quiz" disabled>Tester le titre drôle</button><br>
    <button data-game="culture" disabled>Tester la culture générale</button>
    <details>
      <summary>Réglages du test</summary>
      <form id="settings">
        <p><label for="players">Joueurs</label><br>
          <select id="players" name="players"><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option></select></p>
        <p><label for="image">Image</label><br>
          <select id="image" name="image"><option>cheval.jpg</option><option>cheval2.jpg</option><option>fishler.jpg</option><option>fusee.jpg</option><option>singe.jpg</option><option>sushorse.jpg</option><option>tung.jpg</option></select></p>
        <p><label for="questions">Questions de culture générale</label><br>
          <select id="questions" name="questions"><option>1</option><option selected>3</option><option>5</option></select></p>
        <p><label><input id="bots" type="checkbox" checked> Autres joueurs automatiques</label></p>
        <p><label><input id="fast" type="checkbox" checked> Durées courtes</label></p>
      </form>
    </details>
  </div>
  <div id="game" hidden>
    <button id="stop" disabled>Retour au menu</button>
    <p id="status" role="status"></p>
    <p class="info-tour"><span id="phase"></span> <span id="countdown"></span></p>
    <h2 id="host-title"></h2>
    <p id="host-message"></p>
    <div id="host-content"></div>
    <p id="progress" class="message" role="status"></p>
    <div id="player-cards" class="debug-players"></div>
  </div>
  <p id="error" class="message" role="alert" hidden></p>
</body>
</html>
