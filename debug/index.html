<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mayo Party — Debug</title>
  <link rel="stylesheet" href="../public/style.css">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div id="controls">
    <select id="type" aria-label="Mode de test"><option value="plateau">Plateau + les 3 mini-jeux</option><option value="course">Course de chevaux</option><option value="quiz">Titre drôle</option><option value="culture">Culture générale</option></select>
    <button id="open-phones" disabled>Ouvrir 3 téléphones</button>
    <button id="start" disabled>Tester</button>
    <button id="stop" disabled>Arrêter</button>
    <span id="phone-links" hidden><button data-player="1">Joueur 1</button><button data-player="2">Joueur 2</button><button data-player="3">Joueur 3</button></span>
    <details>
      <summary>Réglages du debug</summary>
      <label>Questions <select id="questions"><option>1</option><option>3</option><option selected>5</option></select></label>
      <label>Image <select id="image"></select></label>
      <label><input id="fast" type="checkbox"> Durées courtes</label>
    </details>
    <p id="status" class="message" role="status">Démarrez node debug/server.js</p>
    <p id="error" class="message" role="alert" hidden></p>
  </div>
  <iframe id="host" title="Écran principal officiel"></iframe>
</body>
</html>
