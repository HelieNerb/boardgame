<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <div id="salon">
      <h1>Mayo Party 🌭 !</h1>
      <p>Code de la partie :</p>
      <h2 id="code" class="code-partie">...</h2>

      <!-- Affichage direct de l'image -->
      <div style="margin: 15px 0;">
        <img id="qr-image" alt="QR Code pour rejoindre" style="display: none; border-radius: 8px;">
      </div>

      <p>⚠️ Vérifiez que vous êtes bien sur le même réseau local que le serveur</p>

      <h3>Joueurs</h3>
      <ul id="liste"></ul>
      <button onclick="socket.emit('demarrer')">Démarrer la partie</button>
    </div>

    <div id="jeu" hidden>
      <h1>Plateau</h1>
      <h2 id="info-tour" class="info-tour"></h2>
      <p id="message-effet" class="message"></p>
      <div id="scores" class="scores"></div>
      <div id="plateau" class="plateau"></div>
    </div>

    <div id="fin" hidden>
      <h1>Fin de la partie 🎉</h1>
      <div id="resultats"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();
      let plateau = [];
      let joueurs = [];
      let pseudoActif = null;

      socket.emit('creer-partie');

      socket.on('partie-creee', ({ code, qr }) => {
        document.getElementById('code').textContent = code;

        if (qr) {
          const img = document.getElementById('qr-image');
          img.src = qr;
          img.style.display = 'inline-block';
        }
      });

      socket.on('liste-joueurs', (liste) => {
        joueurs = liste;
        const ul = document.getElementById('liste');
        ul.innerHTML = '';
        for (const joueur of liste) {
          const li = document.createElement('li');
          li.textContent = joueur.pseudo;
          ul.appendChild(li);
        }
      });

      socket.on('partie-demarree', (donnees) => {
        plateau = donnees.plateau;
        joueurs = donnees.joueurs;
        document.getElementById('salon').hidden = true;
        document.getElementById('jeu').hidden = false;
        afficherPlateau();
      });

      socket.on('tour', ({ tourActuel, nbTours, joueurActif }) => {
        pseudoActif = joueurActif;
        document.getElementById('message-effet').textContent = '';
        document.getElementById('info-tour').textContent =
          'Tour ' + tourActuel + ' / ' + nbTours + ' — C\'est à ' + joueurActif + ' de jouer !';
        afficherPlateau();
      });

      socket.on('positions', (liste) => {
        joueurs = liste;
        afficherPlateau();
      });

      socket.on('effet-case', ({ message }) => {
        document.getElementById('message-effet').textContent = message;
      });

      socket.on('fin-de-partie', ({ classement }) => {
        document.getElementById('jeu').hidden = true;
        document.getElementById('fin').hidden = false;

        // Le serveur envoie déjà le classement trié (étoiles, puis pièces)
        const resultats = document.getElementById('resultats');
        resultats.innerHTML = '';
        classement.forEach((joueur, i) => {
          const p = document.createElement('p');
          p.textContent =
            (i + 1) + '. ' + joueur.pseudo + ' — ' + joueur.etoiles + ' ⭐ — ' + joueur.pieces + ' 🪙';
          resultats.appendChild(p);
        });
      });

      function afficherScores() {
        const div = document.getElementById('scores');
        div.innerHTML = '';
        for (const joueur of joueurs) {
          const carte = document.createElement('div');
          carte.className = 'score' + (joueur.pseudo === pseudoActif ? ' score-actif' : '');
          carte.textContent = joueur.pseudo + ' — ' + joueur.pieces + ' 🪙 — ' + joueur.etoiles + ' ⭐';
          div.appendChild(carte);
        }
      }

      function afficherPlateau() {
        afficherScores();

        const div = document.getElementById('plateau');
        div.innerHTML = '';

        plateau.forEach((type, i) => {
          const caseDiv = document.createElement('div');
          caseDiv.className = 'case ' + type;

          const titre = document.createElement('small');
          titre.textContent = type;
          caseDiv.appendChild(titre);

          for (const joueur of joueurs) {
            if (joueur.position === i) {
              const pion = document.createElement('div');
              pion.textContent = joueur.pseudo;
              if (joueur.pseudo === pseudoActif) {
                pion.className = 'pion-actif';
              }
              caseDiv.appendChild(pion);
            }
          }

          div.appendChild(caseDiv);
        });
      }
    </script>
  </body>
</html>
