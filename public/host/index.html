<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <div id="salon">
      <h1>Mayo Party 🌭 !</h1>
      <p>Code de la partie :</p>
      <h2 id="code" class="code-partie">...</h2>

      <!-- Affichage direct de l'image -->
      <div style="margin: 15px 0;">
        <img id="qr-image" alt="QR Code pour rejoindre" style="display: none; border-radius: 8px;">
      </div>

      <p>⚠️ Vérifiez que vous êtes bien sur le même réseau local que le serveur</p>

      <h3>Joueurs</h3>
      <ul id="liste"></ul>
      <label for="nb-tours">Nombre de tours</label><br>
      <input id="nb-tours" type="number" min="5" max="50" step="1" value="15">
      <p id="estimation-duree" class="message" aria-live="polite"></p>
      <button onclick="demarrerPartie()">Démarrer la partie</button>
    </div>

    <div id="jeu" hidden>
      <h1>Plateau</h1>
      <h2 id="info-tour" class="info-tour"></h2>
      <p id="message-effet" class="message"></p>
      <div id="scores" class="scores"></div>
      <div id="plateau" class="plateau"></div>
    </div>

    <div id="quiz" hidden>
      <h1 id="quiz-titre">Trouve un titre drôle !</h1>
      <h2 id="quiz-chrono" class="info-tour"></h2>
      <img id="quiz-image" class="quiz-image" alt="Image du quiz">
      <p id="quiz-progression" class="message"></p>
      <div id="quiz-propositions" class="propositions"></div>
    </div>

    <!-- [AJOUT] Mini-jeu 2 : quiz de culture générale -->
    <div id="culture" hidden>
      <p id="culture-entete" class="info-tour"></p>
      <h1 id="culture-question" class="culture-question"></h1>
      <h2 id="culture-chrono" class="culture-chrono"></h2>
      <div id="culture-reponses" class="culture-grille culture-grille-hote"></div>
      <p id="culture-progression" class="message"></p>
      <p id="culture-bilan" class="culture-bilan"></p>
      <div id="culture-classement" class="propositions"></div>
    </div>

    <div id="fin" hidden>
      <h1>Fin de la partie 🎉</h1>
      <div id="resultats"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/avatar.js"></script>
    <script>
      const socket = io();
      socket.on('erreur-demarrage', (message) => {
        alert(message);
      });
      let plateau = [];
      let joueurs = [];
      let pseudoActif = null;

      const champNbTours = document.getElementById('nb-tours');
      champNbTours.addEventListener('input', afficherEstimationDuree);

      function afficherEstimationDuree() {
        const nbTours = Number(champNbTours.value);
        const estimation = document.getElementById('estimation-duree');

        if (!Number.isInteger(nbTours) || nbTours < 5 || nbTours > 50) {
          estimation.textContent = 'Choisis entre 5 et 50 tours.';
          return;
        }

        // Repère indicatif : 15 tours correspondent à environ 20 minutes.
        const minutes = Math.round(nbTours * 80 / 60);
        const duree = minutes < 60
          ? minutes + ' min'
          : Math.floor(minutes / 60) + ' h' + (minutes % 60 ? ' ' + (minutes % 60) + ' min' : '');
        estimation.textContent = 'Durée estimée : ' + nbTours + ' tours ≈ ' + duree;
      }

      function demarrerPartie() {
        if (!champNbTours.reportValidity()) return;
        socket.emit('demarrer', { nbTours: Number(champNbTours.value) });
      }

      afficherEstimationDuree();

      socket.emit('creer-partie');

      socket.on('partie-creee', ({ code, qr }) => {
        document.getElementById('code').textContent = code;

        if (qr) {
          const img = document.getElementById('qr-image');
          img.src = qr;
          img.style.display = 'inline-block';
        }
      });

      socket.on('liste-joueurs', (liste) => {
        joueurs = liste;
        const ul = document.getElementById('liste');
        ul.innerHTML = '';
        for (const joueur of liste) {
          const li = document.createElement('li');
          li.className = 'joueur-salon' + (joueur.connecte === false ? ' joueur-deconnecte' : '');
          li.appendChild(MayoAvatar.creer(joueur.avatar, 'avatar-sprite avatar-sprite-salon'));
          const nom = document.createElement('span');
          nom.textContent = joueur.pseudo + (joueur.connecte === false ? ' 💤' : '');
          li.appendChild(nom);
          ul.appendChild(li);
        }
      });

      socket.on('partie-demarree', (donnees) => {
        plateau = donnees.plateau;
        joueurs = donnees.joueurs;
        document.getElementById('salon').hidden = true;
        document.getElementById('jeu').hidden = false;
        afficherPlateau();
      });

      socket.on('tour', ({ tourActuel, nbTours, joueurActif }) => {
        pseudoActif = joueurActif;
        document.getElementById('message-effet').textContent = '';
        document.getElementById('info-tour').textContent =
          'Tour ' + tourActuel + ' / ' + nbTours + ' — C\'est à ' + joueurActif + ' de jouer !';
        afficherPlateau();
      });

      socket.on('positions', (liste) => {
        joueurs = liste;
        afficherPlateau();
      });

      // ── Mini-jeu : quiz du titre drôle ──────────

      let chrono = null;

      // Affiche un compte à rebours dans #quiz-chrono
      // [MODIFIÉ] idElement permet de réutiliser le chrono pour le quiz culture
      function lancerChrono(secondes, idElement = 'quiz-chrono') {
        clearInterval(chrono);
        const el = document.getElementById(idElement);
        let reste = secondes;
        el.textContent = '⏱️ ' + reste + ' s';
        chrono = setInterval(() => {
          reste--;
          el.textContent = reste > 0 ? '⏱️ ' + reste + ' s' : '';
          if (reste <= 0) clearInterval(chrono);
        }, 1000);
      }

      socket.on('quiz-ecriture', ({ image, duree }) => {
        document.getElementById('jeu').hidden = true;
        document.getElementById('quiz').hidden = false;
        document.getElementById('quiz-titre').textContent = 'Écrivez un titre drôle pour cette image !';
        document.getElementById('quiz-image').src = image;
        document.getElementById('quiz-image').hidden = false;
        document.getElementById('quiz-propositions').innerHTML = '';
        lancerChrono(duree);
      });

      socket.on('quiz-progression', ({ etape, fait, total }) => {
        const verbe = etape === 'ecriture' ? 'ont écrit' : 'ont voté';
        document.getElementById('quiz-progression').textContent = fait + ' / ' + total + ' ' + verbe;
      });

      socket.on('quiz-vote', ({ propositions, duree }) => {
        document.getElementById('quiz-titre').textContent = 'Votez pour le titre le plus drôle !';
        const div = document.getElementById('quiz-propositions');
        div.innerHTML = '';
        for (const p of propositions) {
          const carte = document.createElement('div');
          carte.className = 'proposition';
          carte.textContent = p.texte;
          div.appendChild(carte);
        }
        lancerChrono(duree);
      });

      socket.on('quiz-resultats', ({ resultats, gagnants, pieces, assezDeReponses }) => {
        clearInterval(chrono);
        document.getElementById('quiz-chrono').textContent = '';
        document.getElementById('quiz-progression').textContent = '';

        if (!assezDeReponses) {
          document.getElementById('quiz-titre').textContent = 'Pas assez de titres pour voter...';
        } else if (gagnants.length === 0) {
          document.getElementById('quiz-titre').textContent = 'Aucun vote, personne ne gagne de pièces';
        } else {
          document.getElementById('quiz-titre').textContent =
            '🏆 ' + gagnants.join(' et ') + ' gagne' + (gagnants.length > 1 ? 'nt' : '') + ' ' + pieces + ' 🪙 !';
        }

        const div = document.getElementById('quiz-propositions');
        div.innerHTML = '';
        for (const r of resultats) {
          const carte = document.createElement('div');
          carte.className = 'proposition' + (gagnants.includes(r.auteur) ? ' proposition-gagnante' : '');
          carte.textContent = '« ' + r.texte + ' » — ' + r.auteur + ' (' + r.votes + ' vote' + (r.votes > 1 ? 's' : '') + ')';
          div.appendChild(carte);
        }
      });

      // Le tour suivant démarre : on revient au plateau
      socket.on('tour', () => {
        document.getElementById('quiz').hidden = true;
        document.getElementById('jeu').hidden = false;
      });

      socket.on('plateau-mis-a-jour', ({ plateau: nouveauPlateau }) => {
        plateau = nouveauPlateau;
        afficherPlateau();
      });

      socket.on('effet-case', ({ message }) => {
        document.getElementById('message-effet').textContent = message;
      });

      // ── [AJOUT] Mini-jeu : quiz de culture générale (façon Kahoot) ──

      function afficherCulture() {
        document.getElementById('jeu').hidden = true;
        document.getElementById('quiz').hidden = true;
        document.getElementById('culture').hidden = false;
      }

      // Remet l'écran à zéro avant chaque nouvelle étape
      function viderCulture() {
        for (const id of ['culture-chrono', 'culture-progression', 'culture-bilan']) {
          document.getElementById(id).textContent = '';
        }
        document.getElementById('culture-reponses').innerHTML = '';
        document.getElementById('culture-classement').innerHTML = '';
      }

      // Une carte de réponse : forme + texte (+ nombre de joueurs pendant la correction)
      function creerCarteReponse(r) {
        const carte = document.createElement('div');
        carte.className = 'culture-carte culture-' + r.couleur;

        const forme = document.createElement('span');
        forme.className = 'forme forme-' + r.forme;
        const texte = document.createElement('span');
        texte.className = 'culture-carte-texte';
        texte.textContent = r.texte;
        const compteur = document.createElement('span');
        compteur.className = 'culture-compteur';

        carte.append(forme, texte, compteur);
        return carte;
      }

      // Affiche une liste « 1. Till — 1684 points » (+ les pièces à la fin)
      function afficherListeClassement(classement, avecPieces) {
        const div = document.getElementById('culture-classement');
        div.innerHTML = '';
        for (const ligne of classement) {
          const carte = document.createElement('div');
          carte.className = 'proposition' + (ligne.rang === 1 ? ' proposition-gagnante' : '');
          carte.textContent = ligne.rang + '. ' + ligne.pseudo + ' — ' + ligne.score + ' points'
            + (avecPieces && ligne.pieces > 0 ? '  (+' + ligne.pieces + ' 🪙)' : '');
          div.appendChild(carte);
        }
      }

      // 1. La question s'affiche seule quelques secondes
      socket.on('culture-lecture', ({ numero, total, categorie, question, duree }) => {
        afficherCulture();
        viderCulture();
        document.getElementById('culture-entete').textContent =
          'Question ' + numero + ' / ' + total + ' — ' + categorie;
        document.getElementById('culture-question').textContent = question;
        lancerChrono(duree, 'culture-chrono');
      });

      // 2. Les 4 réponses apparaissent, le chrono démarre
      socket.on('culture-question', ({ numero, total, categorie, question, reponses, duree }) => {
        afficherCulture();
        viderCulture();
        document.getElementById('culture-entete').textContent =
          'Question ' + numero + ' / ' + total + ' — ' + categorie;
        document.getElementById('culture-question').textContent = question;

        const div = document.getElementById('culture-reponses');
        for (const r of reponses) div.appendChild(creerCarteReponse(r));
        lancerChrono(duree, 'culture-chrono');
      });

      socket.on('culture-progression', ({ fait, total }) => {
        document.getElementById('culture-progression').textContent = fait + ' / ' + total + ' ont répondu';
      });

      // 3. Correction : bonne réponse en avant, nombre de joueurs par réponse, classement provisoire
      socket.on('culture-correction', ({ bonne, repartition, detail, classement }) => {
        clearInterval(chrono);
        document.getElementById('culture-chrono').textContent = '';
        document.getElementById('culture-progression').textContent = '';

        const cartes = document.querySelectorAll('#culture-reponses .culture-carte');
        cartes.forEach((carte, i) => {
          carte.classList.add(i === bonne ? 'culture-bonne' : 'culture-mauvaise');
          const n = repartition[i];
          carte.querySelector('.culture-compteur').textContent = n + ' joueur' + (n > 1 ? 's' : '');
        });

        const gagnants = detail.filter((d) => d.correct);
        document.getElementById('culture-bilan').textContent = gagnants.length === 0
          ? 'Personne n\'a trouvé !'
          : 'Bonne réponse : ' + gagnants.map((d) => d.pseudo + ' (+' + d.points + ')').join(', ');

        afficherListeClassement(classement, false);
      });

      // 4. Classement final avec les pièces gagnées
      socket.on('culture-classement', ({ classement }) => {
        clearInterval(chrono);
        afficherCulture();
        viderCulture();
        document.getElementById('culture-entete').textContent = 'Quiz terminé !';
        document.getElementById('culture-question').textContent = 'Classement final';
        afficherListeClassement(classement, true);
      });

      // Le tour suivant démarre : on revient au plateau
      socket.on('tour', () => {
        document.getElementById('culture').hidden = true;
      });

      socket.on('fin-de-partie', ({ classement }) => {
        document.getElementById('jeu').hidden = true;
        document.getElementById('quiz').hidden = true;
        document.getElementById('culture').hidden = true; // [AJOUT]
        clearInterval(chrono);
        document.getElementById('fin').hidden = false;

        // Le serveur envoie déjà le classement trié (étoiles, puis pièces)
        const resultats = document.getElementById('resultats');
        resultats.innerHTML = '';
        classement.forEach((joueur, i) => {
          const p = document.createElement('p');
          p.textContent =
            (i + 1) + '. ' + joueur.pseudo + ' — ' + joueur.etoiles + ' ⭐ — ' + joueur.pieces + ' 🪙';
          resultats.appendChild(p);
        });
      });

      function afficherScores() {
        const div = document.getElementById('scores');
        div.innerHTML = '';
        for (const joueur of joueurs) {
          const carte = document.createElement('div');
          carte.className = 'score'
            + (joueur.pseudo === pseudoActif ? ' score-actif' : '')
            + (joueur.connecte === false ? ' score-deconnecte' : '');
          carte.appendChild(MayoAvatar.creer(joueur.avatar, 'avatar-sprite avatar-sprite-score'));
          const infos = document.createElement('span');
          infos.textContent = joueur.pseudo + ' — ' + joueur.pieces + ' 🪙 — ' + joueur.etoiles + ' ⭐'
            + (joueur.connecte === false ? ' 💤' : '');
          carte.appendChild(infos);
          div.appendChild(carte);
        }
      }

      // Calcule la place de chaque case sur le contour d'un rectangle (la "boucle").
      // On part du coin haut-gauche et on tourne dans le sens des aiguilles d'une montre.
      // Un rectangle de largeur L et hauteur H a 2L + 2H - 4 cases sur son contour,
      // donc pour n cases : L = n/4 arrondi au-dessus + 1, puis H = n/2 + 2 - L.
      // (Cela suppose un nombre de cases pair.)
      function positionsBoucle(n) {
        const largeur = Math.ceil(n / 4) + 1;
        const hauteur = n / 2 + 2 - largeur;
        const pos = []; // pos[i] = [ligne, colonne] de la case i (la numérotation CSS commence à 1)

        for (let c = 1; c <= largeur; c++) pos.push([1, c]);             // haut : gauche → droite
        for (let l = 2; l <= hauteur; l++) pos.push([l, largeur]);       // droite : haut → bas
        for (let c = largeur - 1; c >= 1; c--) pos.push([hauteur, c]);   // bas : droite → gauche
        for (let l = hauteur - 1; l >= 2; l--) pos.push([l, 1]);         // gauche : bas → haut

        return { largeur, hauteur, pos };
      }

      function afficherPlateau() {
        afficherScores();

        const div = document.getElementById('plateau');
        div.innerHTML = '';

        // On dimensionne la grille CSS selon le nombre de cases
        const boucle = positionsBoucle(plateau.length);
        div.style.gridTemplateColumns = 'repeat(' + boucle.largeur + ', 120px)';
        div.style.gridTemplateRows = 'repeat(' + boucle.hauteur + ', minmax(90px, auto))';

        plateau.forEach((type, i) => {
          const caseDiv = document.createElement('div');
          caseDiv.className = 'case ' + type;

          // On place la case i à sa ligne / colonne sur le contour
          caseDiv.style.gridRow = boucle.pos[i][0];
          caseDiv.style.gridColumn = boucle.pos[i][1];

          const titre = document.createElement('small');
          titre.textContent = type;
          caseDiv.appendChild(titre);

          const pions = document.createElement('div');
          pions.className = 'pions-case';
          for (const joueur of joueurs) {
            if (joueur.position === i) {
              const pion = document.createElement('div');
              pion.className = 'pion-case'
                + (joueur.pseudo === pseudoActif ? ' pion-actif' : '')
                + (joueur.connecte === false ? ' pion-deconnecte' : '');
              pion.appendChild(MayoAvatar.creer(joueur.avatar, 'avatar-sprite avatar-sprite-plateau'));
              const nom = document.createElement('span');
              nom.className = 'pion-nom';
              nom.textContent = joueur.pseudo;
              pion.appendChild(nom);
              pions.appendChild(pion);
            }
          }
          if (pions.childElementCount) caseDiv.appendChild(pions);

          div.appendChild(caseDiv);
        });
      }
    </script>
  </body>
</html>
