<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <div id="formulaire">
      <h1>Mayo Party</h1>
      <h1>Rejoindre une partie</h1>
      <input id="code" placeholder="Code" maxlength="4"><br>
      <input id="pseudo" placeholder="Pseudo" maxlength="16"><br>
      <button onclick="rejoindre()">Rejoindre</button>
    </div>

    <p id="message" class="message"></p>

    <div id="jeu" hidden>
      <p id="stats" class="stats"></p>
      <p id="statut-tour" class="statut-tour"></p>
      <button id="bouton-de" onclick="lancerDe()" disabled>Lancer le dé</button>
      <p id="de"></p>
    </div>

    <div id="quiz" hidden>
      <div id="quiz-ecriture" hidden>
        <h2>Écris un titre drôle !</h2>
        <p>Regarde l'image sur l'écran principal</p>
        <input id="quiz-texte" placeholder="Ton titre..." maxlength="100" autocomplete="off"><br>
        <button id="quiz-envoyer" onclick="envoyerTitre()">Envoyer</button>
      </div>

      <div id="quiz-vote" hidden>
        <h2>Vote pour le plus drôle !</h2>
        <div id="quiz-choix"></div>
      </div>

      <p id="quiz-message" class="message"></p>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();
      let monPseudo = null;

      const params = new URLSearchParams(window.location.search);
      const codeFromUrl = params.get('code');

      // ── Session : de quoi se reconnecter après une coupure ──
      // On garde { code, pseudo, token } dans le localStorage du téléphone.
      // (try/catch : le localStorage peut être bloqué, par exemple en navigation privée)
      const CLE_SESSION = 'mayo-party-session';

      function lireSession() {
        try { return JSON.parse(localStorage.getItem(CLE_SESSION)); } catch (e) { return null; }
      }
      function sauverSession(session) {
        try { localStorage.setItem(CLE_SESSION, JSON.stringify(session)); } catch (e) {}
      }
      function effacerSession() {
        try { localStorage.removeItem(CLE_SESSION); } catch (e) {}
      }

      // 'connect' se déclenche à l'ouverture de la page ET à chaque reconnexion automatique
      // de Socket.IO : dans les deux cas, si on a une session, on demande à retrouver sa place.
      socket.on('connect', () => {
        const session = lireSession();
        if (!session) return;

        // Le QR code d'une AUTRE partie : l'ancienne session ne sert plus à rien
        if (codeFromUrl && codeFromUrl.toUpperCase() !== session.code) {
          effacerSession();
          return;
        }
        socket.emit('reconnecter', { code: session.code, token: session.token });
      });

      socket.on('disconnect', () => {
        document.getElementById('message').textContent = 'Connexion perdue... reconnexion en cours';
      });

      socket.on('reconnecte', ({ code, pseudo, demarree, joueurs }) => {
        monPseudo = pseudo;
        document.getElementById('formulaire').hidden = true;
        document.getElementById('message').textContent = demarree
          ? 'Reconnecté, content de te revoir ' + pseudo + ' !'
          : 'Salut ' + pseudo + ' ! En attente du début de la partie (' + code + ')';

        if (demarree) {
          document.getElementById('jeu').hidden = false;
          afficherStats(joueurs);
        }
      });

      // La partie n'existe plus, ou le joueur en a été retiré (trop longtemps absent)
      socket.on('reconnexion-refusee', () => {
        const dejaAffiche = document.getElementById('formulaire').hidden;
        effacerSession();
        if (!dejaAffiche) {
          // L'écran montrait la partie : on revient au formulaire avec une explication
          monPseudo = null;
          document.getElementById('formulaire').hidden = false;
          document.getElementById('jeu').hidden = true;
          document.getElementById('quiz').hidden = true;
          document.getElementById('message').textContent =
            'Tu n\'es plus dans cette partie. Tu peux la rejoindre à nouveau si elle n\'a pas commencé.';
        }
      });

      if (codeFromUrl) {
        const champCode = document.getElementById('code');
        champCode.value = codeFromUrl.toUpperCase();
        // Donne directement le focus au pseudo pour que le joueur n'ait plus qu'à taper son nom
        document.getElementById('pseudo').focus();
      }

      function rejoindre() {
        socket.emit('rejoindre', {
          code: document.getElementById('code').value,
          pseudo: document.getElementById('pseudo').value,
        });
      }

      function lancerDe() {
        // On désactive tout de suite : un seul lancer par tour
        document.getElementById('bouton-de').disabled = true;
        socket.emit('lancer-de');
      }

      socket.on('rejoint', ({ code, pseudo, token }) => {
        monPseudo = pseudo;
        sauverSession({ code, pseudo, token });
        document.getElementById('formulaire').hidden = true;
        document.getElementById('message').textContent =
          'Salut ' + pseudo + ' ! En attente du début de la partie (' + code + ')';
      });

      socket.on('erreur', (texte) => {
        document.getElementById('message').textContent = texte;
      });

      socket.on('partie-demarree', () => {
        document.getElementById('message').textContent = 'La partie a commencé !';
        document.getElementById('jeu').hidden = false;
      });

      socket.on('tour', ({ tourActuel, nbTours, joueurActif, peutLancer }) => {
        const monTour = joueurActif === monPseudo;
        // peutLancer est faux si le dé a déjà été lancé (cas d'un joueur qui se reconnecte juste après)
        document.getElementById('bouton-de').disabled = !(monTour && peutLancer);
        document.getElementById('de').textContent = '';
        document.getElementById('statut-tour').textContent = monTour
          ? 'Tour ' + tourActuel + '/' + nbTours + ' — À toi de jouer !'
          : 'Tour ' + tourActuel + '/' + nbTours + ' — C\'est au tour de ' + joueurActif;
      });

      socket.on('resultat-de', (de) => {
        document.getElementById('de').textContent = 'Tu as fait ' + de;
      });

      // Le message d'effet est affiché sous le dé, uniquement pour le joueur concerné
      socket.on('effet-case', ({ pseudo, message }) => {
        if (pseudo === monPseudo) {
          document.getElementById('de').textContent += ' — ' + message;
        }
      });

      // On retrouve ses propres compteurs dans la liste de tous les joueurs
      function afficherStats(joueurs) {
        const moi = joueurs.find((j) => j.pseudo === monPseudo);
        if (moi) {
          document.getElementById('stats').textContent = moi.pieces + ' 🪙 — ' + moi.etoiles + ' ⭐';
        }
      }

      // À chaque mise à jour des positions, et dès le début de la partie
      socket.on('positions', afficherStats);
      socket.on('partie-demarree', ({ joueurs }) => afficherStats(joueurs));

      // ── Mini-jeu : quiz du titre drôle ──────────

      let monIdQuiz = null; // l'id de mon propre titre (je ne peux pas voter pour lui)

      function afficherQuiz(partie) {
        // partie : 'ecriture', 'vote' ou null pour tout masquer
        document.getElementById('quiz').hidden = partie === null;
        document.getElementById('quiz-ecriture').hidden = partie !== 'ecriture';
        document.getElementById('quiz-vote').hidden = partie !== 'vote';
        document.getElementById('jeu').hidden = partie !== null;
      }

      function envoyerTitre() {
        const champ = document.getElementById('quiz-texte');
        if (champ.value.trim() === '') return;
        socket.emit('quiz-reponse', champ.value);
        // On verrouille tout de suite ; le serveur confirme avec 'quiz-reponse-ok'
        champ.disabled = true;
        document.getElementById('quiz-envoyer').disabled = true;
      }

      socket.on('quiz-ecriture', ({ dejaRepondu } = {}) => {
        const champ = document.getElementById('quiz-texte');
        champ.value = '';
        champ.disabled = !!dejaRepondu;
        document.getElementById('quiz-envoyer').disabled = !!dejaRepondu;
        document.getElementById('quiz-message').textContent =
          dejaRepondu ? 'Titre envoyé ! On attend les autres...' : '';
        monIdQuiz = null;
        afficherQuiz('ecriture');
      });

      socket.on('quiz-reponse-ok', () => {
        document.getElementById('quiz-message').textContent = 'Titre envoyé ! On attend les autres...';
      });

      socket.on('quiz-mon-id', ({ id }) => {
        monIdQuiz = id;
      });

      socket.on('quiz-vote', ({ propositions, dejaVote }) => {
        afficherQuiz('vote');
        document.getElementById('quiz-message').textContent = dejaVote ? 'Vote enregistré !' : '';
        const div = document.getElementById('quiz-choix');
        div.innerHTML = '';
        for (const p of propositions) {
          if (p.id === monIdQuiz) continue; // pas de vote pour soi (le serveur vérifie aussi)
          const bouton = document.createElement('button');
          bouton.className = 'choix';
          bouton.textContent = p.texte;
          bouton.disabled = !!dejaVote; // déjà voté avant la coupure : on ne peut pas revoter
          bouton.onclick = () => {
            socket.emit('quiz-vote', p.id);
            for (const b of div.querySelectorAll('button')) b.disabled = true;
          };
          div.appendChild(bouton);
        }
        if (div.children.length === 0) {
          document.getElementById('quiz-message').textContent = 'Personne d\'autre n\'a écrit de titre...';
        }
      });

      socket.on('quiz-vote-ok', () => {
        document.getElementById('quiz-message').textContent = 'Vote enregistré !';
      });

      socket.on('quiz-resultats', ({ gagnants, pieces }) => {
        afficherQuiz('vote');
        document.getElementById('quiz-choix').innerHTML = '';
        document.getElementById('quiz-message').textContent = gagnants.includes(monPseudo)
          ? '🏆 Ton titre a gagné ! +' + pieces + ' 🪙'
          : 'Regarde les résultats sur l\'écran principal';
      });

      // Le tour suivant démarre : on revient au dé
      socket.on('tour', () => afficherQuiz(null));

      socket.on('fin-de-partie', () => {
        afficherQuiz(null);
        document.getElementById('bouton-de').disabled = true;
        document.getElementById('statut-tour').textContent = 'La partie est terminée !';
      });
    </script>
  </body>
</html>
