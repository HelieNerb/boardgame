<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <div id="formulaire">
      <h1>Mayo Party</h1>
      <h1>Rejoindre une partie</h1>
      <input id="code" placeholder="Code" maxlength="4"><br>
      <input id="pseudo" placeholder="Pseudo" maxlength="16"><br>
      <button onclick="rejoindre()">Rejoindre</button>
    </div>

    <p id="message" class="message"></p>

    <div id="jeu" hidden>
      <p id="statut-tour" class="statut-tour"></p>
      <button id="bouton-de" onclick="lancerDe()" disabled>Lancer le dé</button>
      <p id="de"></p>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();
      let monPseudo = null;

      const params = new URLSearchParams(window.location.search);
      const codeFromUrl = params.get('code');

      if (codeFromUrl) {
        const champCode = document.getElementById('code');
        champCode.value = codeFromUrl.toUpperCase();
        // Donne directement le focus au pseudo pour que le joueur n'ait plus qu'à taper son nom
        document.getElementById('pseudo').focus();
      }

      function rejoindre() {
        socket.emit('rejoindre', {
          code: document.getElementById('code').value,
          pseudo: document.getElementById('pseudo').value,
        });
      }

      function lancerDe() {
        // On désactive tout de suite : un seul lancer par tour
        document.getElementById('bouton-de').disabled = true;
        socket.emit('lancer-de');
      }

      socket.on('rejoint', ({ code, pseudo }) => {
        monPseudo = pseudo;
        document.getElementById('formulaire').hidden = true;
        document.getElementById('message').textContent =
          'Salut ' + pseudo + ' ! En attente du début de la partie (' + code + ')';
      });

      socket.on('erreur', (texte) => {
        document.getElementById('message').textContent = texte;
      });

      socket.on('partie-demarree', () => {
        document.getElementById('message').textContent = 'La partie a commencé !';
        document.getElementById('jeu').hidden = false;
      });

      socket.on('tour', ({ tourActuel, nbTours, joueurActif }) => {
        const monTour = joueurActif === monPseudo;
        document.getElementById('bouton-de').disabled = !monTour;
        document.getElementById('de').textContent = '';
        document.getElementById('statut-tour').textContent = monTour
          ? 'Tour ' + tourActuel + '/' + nbTours + ' — À toi de jouer !'
          : 'Tour ' + tourActuel + '/' + nbTours + ' — C\'est au tour de ' + joueurActif;
      });

      socket.on('resultat-de', (de) => {
        document.getElementById('de').textContent = 'Tu as fait ' + de;
      });

      socket.on('fin-de-partie', () => {
        document.getElementById('bouton-de').disabled = true;
        document.getElementById('statut-tour').textContent = 'La partie est terminée !';
      });
    </script>
  </body>
</html>
